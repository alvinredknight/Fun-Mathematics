<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Spectrum Lab</title>

<style>
/* Layout concept: a lab bench. A hub of chunky, color-coded experiment cards (hard-edged, like labeled reagent boxes)
   that open into one working bench per activity. The palette is the visible spectrum and the universal-indicator
   scale, the one thing both Physics (light) and Chemistry (pH) share. */
:root{
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --paper:#f4f5fb; --surface:#ffffff; --surface2:#eaecf8; --ink:#14162b; --ink2:#454a69; --line:#cfd3ea; --edge:#14162b;
  --red:#ef3b3b; --orange:#ff8a1f; --yellow:#ffc928; --green:#18b26a; --cyan:#17b8d9; --blue:#3358ff; --violet:#8a3ffc; --pink:#ff4f9a;
  --on-light:#ffffff; --on-dark:#14162b;
  --good:#0e7a43; --bad:#c81f2a; --focus:#3358ff;
  --cat-alkali:#ff7a6b; --cat-earth:#ffa94d; --cat-trans:#ffd84d; --cat-post:#8fe07d; --cat-meta:#35d6b4; --cat-non:#55c8f2; --cat-hal:#8b9bff; --cat-noble:#c99bff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#0e0f20;--surface:#191b35;--surface2:#242749;--ink:#f1f2ff;--ink2:#b6bbe0;--line:#363a66;--edge:#7a80d6;--good:#4be08f;--bad:#ff7b82;--focus:#9db0ff;color-scheme:dark}
}
:root[data-theme="dark"]{--paper:#0e0f20;--surface:#191b35;--surface2:#242749;--ink:#f1f2ff;--ink2:#b6bbe0;--line:#363a66;--edge:#7a80d6;--good:#4be08f;--bad:#ff7b82;--focus:#9db0ff;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);line-height:1.05;margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
sub,sup{line-height:0}

.spectrum{height:8px;border-radius:99px;margin-top:14px;background:linear-gradient(90deg,var(--red),var(--orange),var(--yellow),var(--green),var(--cyan),var(--blue),var(--violet),var(--pink))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 6px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:1.35rem;letter-spacing:-.01em}
.brand svg{width:34px;height:34px;flex:none}

button,.btn{font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:2px solid var(--edge);border-radius:10px;padding:8px 16px;min-height:44px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .08s,background .15s,filter .15s;text-align:center}
button:hover,.btn:hover{background:var(--surface2)}
button:active,.btn:active{transform:translateY(1px)}
button[disabled]{opacity:.5;cursor:not-allowed}
.primary{background:var(--c,var(--blue));color:var(--on,var(--on-light))}
.primary:hover{background:var(--c,var(--blue));filter:brightness(1.08)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
input[type=range]{accent-color:var(--c,var(--blue));width:100%;min-height:32px;margin:0}
input[type=text],input[type=search],input[type=number],select{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--edge);border-radius:10px;padding:8px 12px;min-height:44px;max-width:100%}
select{padding-right:8px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
label.btn:focus-within{outline:3px solid var(--focus);outline-offset:2px}

/* hub */
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:end;padding:34px 0 20px}
.hero h1{font-size:clamp(2.4rem,7vw,4.6rem);font-weight:800;letter-spacing:-.03em}
.hero p{color:var(--ink2);margin-top:12px;max-width:52ch;font-size:1.05rem}
.stat-box{background:var(--surface);border:2px solid var(--edge);border-radius:16px;padding:14px 16px;box-shadow:4px 4px 0 var(--edge)}
.stat-box .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.pbar{height:12px;border-radius:99px;background:var(--surface2);border:2px solid var(--edge);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--cyan),var(--blue),var(--violet));transition:width .4s}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:6px 0 18px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tools .search{flex:1 1 220px;min-width:0}
.tools .search input{width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:0;text-align:left;border-radius:16px;background:var(--surface);overflow:hidden;box-shadow:5px 5px 0 var(--edge);font-weight:500;transition:transform .12s,box-shadow .12s}
.card:hover{background:var(--surface);transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--edge)}
.card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--edge)}
.tile{background:var(--c);color:var(--on);padding:14px 16px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;border-bottom:2px solid var(--edge)}
.tile .glyph{font-family:var(--font-display);font-weight:800;font-size:4rem;line-height:.95;letter-spacing:-.03em}
.tile .subj{font:700 .72rem var(--font-mono);letter-spacing:.12em;text-transform:uppercase}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:1.3rem;font-weight:700}
.card p{color:var(--ink2);font-size:.95rem}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.tag{font:600 .74rem var(--font-body);border:1.5px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--ink2);background:var(--surface2)}
.tag.done{border-color:var(--good);color:var(--good);background:transparent}
.empty{grid-column:1/-1;padding:24px;border:2px dashed var(--line);border-radius:16px;color:var(--ink2)}
.io{margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.io .panel h3{font-size:1.1rem;margin-bottom:10px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:2px solid var(--edge);border-radius:99px;padding:3px 12px;font-weight:600;font-size:.9rem;background:var(--surface2)}
.note{color:var(--ink2);font-size:.9rem;margin-top:10px}

/* activity shell */
.act-head{background:var(--c);color:var(--on);border:2px solid var(--edge);border-radius:16px;box-shadow:5px 5px 0 var(--edge);padding:16px;margin-top:18px;display:grid;gap:12px}
.act-head .back{background:transparent;color:inherit;border-color:currentColor;justify-self:start;min-height:40px}
.act-head .back:hover{background:rgba(255,255,255,.2)}
.act-head h2{font-size:clamp(1.8rem,5vw,3rem);font-weight:800;letter-spacing:-.02em}
.act-head p{max-width:62ch;opacity:.92}
.act-head .meta{display:flex;flex-wrap:wrap;gap:8px}
.act-head .meta span{font:700 .72rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase;border:1.5px solid currentColor;border-radius:99px;padding:2px 10px}
.stage{display:grid;gap:18px;margin-top:20px;--c:var(--blue);--on:var(--on-light)}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:grid;gap:14px;min-width:0}
.panel{background:var(--surface);border:2px solid var(--edge);border-radius:16px;padding:16px;box-shadow:4px 4px 0 var(--edge);min-width:0}
.panel h3{font-size:1.15rem;font-weight:700;margin-bottom:10px}
.panel .hint{color:var(--ink2);font-size:.92rem}
canvas.scene{display:block;width:100%;border:2px solid var(--edge);border-radius:12px;background:var(--surface2);touch-action:manipulation}
canvas.drag{touch-action:none;cursor:grab}
.ctl{display:grid;grid-template-columns:minmax(84px,auto) minmax(0,1fr) 72px;gap:10px;align-items:center}
.ctl label{font-weight:600}
.ctl output{font-family:var(--font-mono);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat{background:var(--surface2);border-radius:12px;padding:10px 12px;min-width:0}
.stat span{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:700}
.stat b{display:block;font-family:var(--font-mono);font-size:1.15rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.msg{min-height:1.5em;font-weight:600}
.msg.good{color:var(--good)}
.msg.bad{color:var(--bad)}
.progress .prow{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.done-msg{margin-top:10px;font-weight:700;color:var(--good)}
.formula{font-family:var(--font-mono);background:var(--surface2);border-radius:10px;padding:8px 12px;font-size:.95rem;overflow-wrap:anywhere}
.qbox{display:grid;gap:10px}
.qtext{font-size:1.1rem;font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.fileline{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
video.live{display:block;width:100%;max-width:480px;border:2px solid var(--edge);border-radius:12px;background:#000}

/* periodic table */
.ptwrap{overflow-x:auto;padding:2px 2px 10px}
.pt{display:grid;grid-template-columns:repeat(18,minmax(38px,1fr));gap:4px;min-width:760px}
.pt .gap{min-height:0}
.el{position:relative;min-height:0;padding:0;aspect-ratio:1/1.05;flex-direction:column;gap:0;border-radius:8px;background:var(--cat);color:var(--on-dark);font-family:var(--font-display);font-weight:800;font-size:1.05rem;line-height:1}
.el:hover{background:var(--cat);filter:brightness(1.08)}
.el small{position:absolute;top:3px;left:5px;font:600 .58rem var(--font-mono)}
.el.dim{opacity:.22}
.el[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:1px;transform:scale(1.08);z-index:1}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.legend button{min-height:34px;padding:2px 12px;font-size:.85rem;background:var(--cat);color:var(--on-dark)}
.legend button:hover{background:var(--cat)}
.legend button[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:1px}
.detail{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.bigel{width:116px;aspect-ratio:1;border:2px solid var(--edge);border-radius:14px;background:var(--cat);color:var(--on-dark);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:3.2rem;position:relative}
.bigel small{position:absolute;top:6px;left:9px;font:700 .8rem var(--font-mono)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.facts dt{color:var(--ink2);font-weight:600}
.facts dd{margin:0;font-weight:700;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.bohr{width:100%;max-width:300px;margin:0 auto;display:block}
.bohr .shell{fill:none;stroke:var(--line);stroke-width:1.6}
.bohr .e{fill:var(--cyan);stroke:var(--ink);stroke-width:1.2}
.bohr .nuc{fill:var(--orange);stroke:var(--ink);stroke-width:1.5}
.bohr text{fill:var(--on-dark);font:800 12px var(--font-mono);text-anchor:middle}

/* atom + equations + ph */
.stepper{display:grid;grid-template-columns:minmax(96px,auto) 44px 56px 44px;gap:8px;align-items:center}
.stepper button{padding:0;font-size:1.4rem;min-width:44px}
.stepper output{text-align:center;font-family:var(--font-mono);font-weight:700;font-size:1.3rem}
.notation{font-family:var(--font-display);font-weight:800;font-size:3rem;line-height:1;display:inline-flex;align-items:center;gap:2px}
.notation .az{display:inline-flex;flex-direction:column;font-size:1rem;font-family:var(--font-mono);line-height:1.05;text-align:right}
.notation .ch{font-size:1.4rem;align-self:flex-start}
.eq{display:flex;flex-wrap:wrap;gap:10px 8px;align-items:center;font-size:1.25rem;font-family:var(--font-mono)}
.term{display:inline-flex;align-items:center;gap:4px}
.term .cbtn{min-height:36px;min-width:36px;padding:0;font-size:1.1rem}
.term output{min-width:1.6em;text-align:center;font-weight:700;color:var(--c)}
.arrow{font-size:1.6rem;padding:0 6px}
table.counts{border-collapse:collapse;width:100%;font-family:var(--font-mono)}
table.counts th,table.counts td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:center}
table.counts th{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}
.ok{color:var(--good);font-weight:700}
.no{color:var(--bad);font-weight:700}
.swatch{border:2px solid var(--edge);border-radius:14px;min-height:96px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:2.4rem;color:#14162b}
.phbar{height:26px;border:2px solid var(--edge);border-radius:8px}
.phticks{display:flex;justify-content:space-between;font:600 .72rem var(--font-mono);color:var(--ink2);padding:2px 2px 0}
.chiprow{display:flex;flex-wrap:wrap;gap:8px}
.chiprow button{min-height:36px;padding:2px 12px;font-size:.88rem}
.picked{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.picked .sw{width:64px;height:64px;border:2px solid var(--edge);border-radius:12px;flex:none}
canvas.photo{display:block;max-width:100%;width:100%;max-height:360px;object-fit:contain;border:2px solid var(--edge);border-radius:12px;cursor:crosshair;background:var(--surface2);touch-action:manipulation}

@media (max-width:820px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .split{grid-template-columns:minmax(0,1fr)}
  .detail{grid-template-columns:minmax(0,1fr)}
  .bigel{width:100px}
}
@media (max-width:480px){
  .ctl{grid-template-columns:minmax(0,1fr) 72px}
  .ctl input[type=range]{grid-column:1/-1;grid-row:2}
  .stepper{grid-template-columns:minmax(0,1fr) 44px 52px 44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4 36 34H4Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M26 21l10-3M27 25l10 1M26 29l9 6" stroke-width="3" stroke-linecap="round" stroke="#ff8a1f"/><path d="M27 25l10 1" stroke="#18b26a" stroke-width="3" stroke-linecap="round"/><path d="M26 29l9 6" stroke="#8a3ffc" stroke-width="3" stroke-linecap="round"/></svg>

<script>
/* ============ PURE HELPERS (unit-tested) ============ */
/* PURE:START */
function parseFormula(s){
  let i=0;
  function num(){let d='';while(i<s.length&&/\d/.test(s[i])){d+=s[i];i++}return d?parseInt(d,10):1}
  function grp(){
    const m={};
    while(i<s.length){
      const ch=s[i];
      if(ch==='('){i++;const inner=grp();const n=num();for(const k in inner)m[k]=(m[k]||0)+inner[k]*n}
      else if(ch===')'){i++;return m}
      else if(/[A-Z]/.test(ch)){let sym=ch;i++;while(i<s.length&&/[a-z]/.test(s[i])){sym+=s[i];i++}const n=num();m[sym]=(m[sym]||0)+n}
      else i++;
    }
    return m;
  }
  return grp();
}
function gcd(a,b){return b?gcd(b,a%b):a}
function fft(re,im){
  const n=re.length;
  for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;if(i<j){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
  for(let len=2;len<=n;len<<=1){
    const ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang),hf=len>>1;
    for(let i=0;i<n;i+=len){
      let cr=1,ci=0;
      for(let j=0;j<hf;j++){
        const ur=re[i+j],ui=im[i+j],xr=re[i+j+hf],xi=im[i+j+hf];
        const vr=xr*cr-xi*ci,vi=xr*ci+xi*cr;
        re[i+j]=ur+vr;im[i+j]=ui+vi;re[i+j+hf]=ur-vr;im[i+j+hf]=ui-vi;
        const nr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=nr;
      }
    }
  }
}
function pitchFromSamples(d,sr){
  let N=8192;while(N>d.length&&N>512)N>>=1;
  if(d.length<N)return null;
  const hop=N>>1;let best=0,bestE=-1;
  for(let s=0;s+N<=d.length;s+=hop){let e=0;for(let i=s;i<s+N;i+=4)e+=d[i]*d[i];if(e>bestE){bestE=e;best=s}}
  const re=new Float64Array(N),im=new Float64Array(N);let rms=0;
  for(let i=0;i<N;i++){const v=d[best+i];rms+=v*v;re[i]=v*(0.5-0.5*Math.cos(2*Math.PI*i/(N-1)))}
  rms=Math.sqrt(rms/N);fft(re,im);
  const half=N>>1,mag=new Float64Array(half);
  for(let i=0;i<half;i++)mag[i]=Math.hypot(re[i],im[i]);
  const binHz=sr/N,lo=Math.max(2,Math.ceil(60/binHz)),hi=Math.min(half-2,Math.floor(4000/binHz));
  let pk=lo;for(let i=lo;i<=hi;i++)if(mag[i]>mag[pk])pk=i;
  const a=Math.log(mag[pk-1]+1e-12),b=Math.log(mag[pk]+1e-12),c=Math.log(mag[pk+1]+1e-12),den=a-2*b+c;
  const p=den!==0&&isFinite(den)?0.5*(a-c)/den:0;
  return {f:(pk+p)*binHz,db:20*Math.log10(rms+1e-12),mag,binHz,peak:mag[pk]};
}
function peakFromDb(arr,binHz){
  const lo=Math.max(2,Math.ceil(60/binHz)),hi=Math.min(arr.length-2,Math.floor(4000/binHz));
  let pk=lo;for(let i=lo;i<=hi;i++)if(arr[i]>arr[pk])pk=i;
  const a=arr[pk-1],b=arr[pk],c=arr[pk+1],den=a-2*b+c;
  const p=den!==0&&isFinite(den)?0.5*(a-c)/den:0;
  return {f:(pk+p)*binHz,db:b};
}
const NOTE_NAMES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
function noteOf(f){
  const n=Math.round(12*Math.log2(f/440)+69);
  const cents=Math.round(1200*Math.log2(f/(440*Math.pow(2,(n-69)/12))));
  return {name:NOTE_NAMES[((n%12)+12)%12]+(Math.floor(n/12)-1),cents};
}
function shellsFor(z){
  if(z<=0)return [];
  if(z<=2)return [z];
  if(z<=10)return [2,z-2];
  if(z<=18)return [2,8,z-10];
  if(z===24)return [2,8,13,1];
  if(z===29)return [2,8,18,1];
  if(z<=20)return [2,8,8,z-18];
  if(z<=30)return [2,8,8+(z-20),2];
  if(z<=36)return [2,8,18,z-28];
  return [2,8,18,8,z-36];
}

        h('div',{class:'panel'},h('h3',{},'Bench'),

        h('div',{class:'panel'},h('h3',{},'Predict the period'),

  blurb:'Set the coefficients until the atom counts match on both sides. Use the smallest whole numbers.',
  mount(root,cx){
    const EQS=[
      {r:['H2','O2'],p:['H2O']},{r:['KClO3'],p:['KCl','O2']},{r:['N2','H2'],p:['NH3']},
      {r:['CH4','O2'],p:['CO2','H2O']},{r:['Fe','O2'],p:['Fe2O3']},{r:['Ca(OH)2','H3PO4'],p:['Ca3(PO4)2','H2O']}];
    let idx=0,co=[],solved=false;
    const prog=Progress(cx,EQS.length,'Equations balanced');
    const eqBox=h('div',{class:'eq'}),tbl=h('div'),msg=h('div',{class:'msg',role:'status'});
    const checkBtn=h('button',{class:'primary',onclick:check},'Check equation');

    const title=h('h3',{});
    root.append(h('div',{class:'split'},
      h('div',{class:'stack'},h('div',{class:'panel'},title,eqBox,h('div',{class:'row',style:'margin-top:14px'},checkBtn,nextBtn),msg)),
      h('div',{class:'stack'},h('div',{class:'panel'},h('h3',{},'Atom count'),tbl),h('div',{class:'panel'},prog.el))));
    const all=()=>EQS[idx].r.concat(EQS[idx].p);

      const L={},R={},n=EQS[idx].r.length;
      all().forEach((f,i)=>{const m=parseFormula(f),side=i<n?L:R;for(const k in m)side[k]=(side[k]||0)+m[k]*co[i]});
      return {L,R};
    }
    function renderEq(){
      title.textContent='Equation '+(idx+1)+' of '+EQS.length;
      const n=EQS[idx].r.length,parts=[];

        if(i===n)parts.push(h('span',{class:'arrow','aria-label':'yields'},'→'));
        else if(i>0)parts.push(h('span',{},'+'));
        const out=h('output',{'aria-live':'polite'},co[i]);
        parts.push(h('span',{class:'term'},
          h('button',{class:'cbtn','aria-label':'Decrease coefficient of '+f,onclick:()=>{if(solved)return;co[i]=Math.max(1,co[i]-1);out.textContent=co[i];renderTbl()}},'−'),out,
          h('button',{class:'cbtn','aria-label':'Increase coefficient of '+f,onclick:()=>{if(solved)return;co[i]=Math.min(12,co[i]+1);out.textContent=co[i];renderTbl()}},'+'),
          h('span',{html:sub(f)})));
      });
      eqBox.replaceChildren(...parts);renderTbl();
    }
    function renderTbl(){
      const {L,R}=counts(),els=[...new Set(Object.keys(L).concat(Object.keys(R)))];
      const t=h('table',{class:'counts'},h('thead',{},h('tr',{},h('th',{},'Atom'),h('th',{},'Left'),h('th',{},'Right'),h('th',{},'Status'))),
        h('tbody',{},els.map(k=>{const a=L[k]||0,b=R[k]||0,same=a===b;
          return h('tr',{},h('td',{},k),h('td',{},a),h('td',{},b),h('td',{class:same?'ok':'no'},same?'✓ equal':'✗ differ'))})));
      tbl.replaceChildren(h('div',{style:'overflow-x:auto'},t));
    }
    function check(){
      if(solved)return;
      const {L,R}=counts(),els=Object.keys(L).concat(Object.keys(R)),bal=els.every(k=>(L[k]||0)===(R[k]||0));
      const g=co.reduce(gcd);
      if(bal&&g===1){solved=true;msg.className='msg good';msg.textContent='Balanced with the smallest whole numbers.';prog.hit();Snd.ok();
        nextBtn.hidden=false;nextBtn.textContent=idx<EQS.length-1?'Next equation':'Play again';checkBtn.disabled=true}
      else if(bal){prog.miss();Snd.no();msg.className='msg bad';msg.textContent='Balanced, but every coefficient can be divided by '+g+'. Use the smallest numbers.'}
      else{prog.miss();Snd.no();msg.className='msg bad';msg.textContent='Not balanced yet. Fix the rows marked ✗ in the atom count.'}
    }
    function nextEq(){idx=(idx+1)%EQS.length;load()}
    function load(){co=all().map(()=>1);solved=false;msg.textContent='';msg.className='msg';nextBtn.hidden=true;checkBtn.disabled=false;renderEq()}
    load();
  }
});

        h('div',{},near?h('b',{},'Closest indicator color: pH '+m.ph.toFixed(1)+' ('+(m.ph<6.5?'acidic':m.ph>7.5?'basic':'neutral')+')'):h('b',{},'No close match on the indicator chart. Try better light or another spot.')),
        near?h('button',{onclick:()=>{slider.value=m.ph;paintScale();slider.scrollIntoView({block:'center',behavior:'smooth'})}},'Show this on the scale'):null);
      Snd.blip(500+m.ph*40,.1,'sine',.12);
    }
    photo.addEventListener('pointerdown',e=>{
      if(!base)return;const r=photo.getBoundingClientRect();
      sample((e.clientX-r.left)*photo.width/r.width,(e.clientY-r.top)*photo.height/r.height);
    });
    let qa=null,lockq=false,qn=0;
    function newQ(){
      lockq=false;qMsg.textContent='';qMsg.className='msg';opts.replaceChildren();qn++;
      if(qn%2){
        const n=ri(1,13);qa={a:n};
        qText.innerHTML='A solution has [H<sup>+</sup>] = 1×10<sup>−'+n+'</sup> mol/L. What is its pH?';
        const set=new Set([n]);while(set.size<4){const d=clamp(n+ri(-3,3),0,14);set.add(d)}
        shuffle([...set]).forEach(v=>opts.append(h('button',{onclick:()=>answer(v===n,'pH '+n)},'pH '+v)));
      }else{
        const base1=pick(SUBS.filter(s=>s[1]>7.5)),acids=shuffle(SUBS.filter(s=>s[1]<6.5)).slice(0,3),list=shuffle([base1].concat(acids));
        qText.textContent='Which of these is basic?';
        list.forEach(s=>opts.append(h('button',{onclick:()=>answer(s===base1,base1[0]+' has pH '+base1[1])},s[0])));
      }
    }
    function answer(ok,exp){
      if(lockq)return;lockq=true;
      if(ok){say(qMsg,'Correct. '+exp+'.','good');prog.hit();Snd.ok()}else{say(qMsg,'Not quite. '+exp+'.','bad');prog.miss();Snd.no()}
      cx.timeout(newQ,1700);
    }
    paintScale();newQ();
  }
});

/* ============ hub ============ */
const app=document.getElementById('app');
let current=null,filter='all',query='',statBits=null;
function unmount(){if(current){current.destroy();current=null}}
function paintStat(){
  if(!statBits)return;
  const n=ACTIVITIES.filter(a=>state.done[a.id]!=null).length;
  statBits.txt.textContent=n+' of '+ACTIVITIES.length;statBits.fill.style.width=(n/ACTIVITIES.length*100)+'%';
}
function cardFor(a){
  const done=state.done[a.id];
  return h('button',{class:'card',style:'--c:var('+a.color+');--on:var('+a.on+')',onclick:()=>openActivity(a.id),'aria-label':a.title+', '+a.subject+', grades '+a.grades},
    h('div',{class:'tile'},h('span',{class:'subj'},a.subject),h('span',{class:'glyph'},a.glyph)),
    h('div',{class:'card-body'},h('h3',{},a.title),h('p',{},a.blurb),
      h('div',{class:'tags'},h('span',{class:'tag'},'Grades '+a.grades),h('span',{class:'tag'},a.topic),a.uses.map(u=>h('span',{class:'tag'},u)),done!=null?h('span',{class:'tag done'},'✓ Completed '+done+'%'):null)));
}
function showHome(){
  unmount();
  const txt=h('span',{class:'mono'}),fill=h('i');statBits={txt,fill};
  const grid=h('div',{class:'grid'});
  const count=s=>ACTIVITIES.filter(a=>s==='all'||a.subject===s).length;
  const segs=[['all','All'],['physics','Physics'],['chemistry','Chemistry']].map(([k,l])=>h('button',{'aria-pressed':String(filter===k),onclick:()=>{filter=k;segs.forEach((b,i)=>b.setAttribute('aria-pressed',String(['all','physics','chemistry'][i]===filter)));paintGrid()}},l+' ('+count(k)+')'));
  const search=h('input',{type:'search',id:'q',placeholder:'Search experiments','aria-label':'Search experiments',value:query});
  search.addEventListener('input',()=>{query=search.value.trim().toLowerCase();paintGrid()});
  function paintGrid(){
    const list=ACTIVITIES.filter(a=>(filter==='all'||a.subject===filter)&&(!query||(a.title+' '+a.blurb+' '+a.topic+' '+a.subject).toLowerCase().includes(query)));
    grid.replaceChildren(...list.map(cardFor));
    if(!list.length)grid.append(h('p',{class:'empty'},'No experiments match that search. Try “pH”, “motion” or “atom”.'));
  }
  app.replaceChildren(
    h('section',{class:'hero'},
      h('div',{},h('h1',{},'Pick an experiment.'),h('p',{},'Physics and Chemistry activities for grades 9 to 12. Every click makes a sound, so turn your volume up.')),
      h('div',{class:'stat-box'},h('div',{class:'row'},h('strong',{},'Completed'),txt),h('div',{class:'pbar'},fill))),
    h('div',{class:'tools'},h('div',{class:'seg'},segs),h('div',{class:'search'},search)),
    grid,
    h('section',{class:'io','aria-label':'Devices'},
      h('div',{class:'panel'},h('h3',{},'You can use'),h('div',{class:'pills'},['Keyboard','Mouse','Touchscreen','Camera','Microphone'].map(x=>h('span',{class:'pill'},x))),
        h('p',{class:'note'},'Camera and microphone activities try live access first. If your browser blocks it, they switch to taking a photo or recording with your device.')),
      h('div',{class:'panel'},h('h3',{},'You get'),h('div',{class:'pills'},['Screen','Speaker'].map(x=>h('span',{class:'pill'},x))),
        h('p',{class:'note'},'Progress is saved in this browser only.'))));
  paintGrid();paintStat();
}
function openActivity(id){
  const a=ACTIVITIES.find(x=>x.id===id);if(!a)return;
  unmount();statBits=null;
  const cx=makeCtx(a);current=cx;
  const stage=h('div',{class:'stage',style:'--c:var('+a.color+');--on:var('+a.on+')'});
  app.replaceChildren(
    h('section',{class:'act-head',style:'--c:var('+a.color+');--on:var('+a.on+')'},
      h('button',{class:'back',onclick:showHome},'← All experiments'),
      h('div',{class:'meta'},h('span',{},a.subject),h('span',{},'Grades '+a.grades),h('span',{},a.topic)),
      h('h2',{},a.title),h('p',{},a.blurb)),
    stage);
  try{a.mount(stage,cx)}catch(err){stage.append(h('div',{class:'panel'},h('p',{class:'msg bad'},'This activity could not start. Go back and try again.')))}
  window.scrollTo(0,0);
}

/* sound toggle */
const soundBtn=document.getElementById('sound');
const ICON_ON='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_OFF='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function paintSound(){soundBtn.innerHTML=(state.muted?ICON_OFF:ICON_ON)+'<span>'+(state.muted?'Sound off':'Sound on')+'</span>';soundBtn.setAttribute('aria-pressed',String(!state.muted))}
soundBtn.addEventListener('click',()=>{state.muted=!state.muted;persist();paintSound();if(!state.muted)Snd.ok()});
paintSound();showHome();
})();
